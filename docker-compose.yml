version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tracepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: tracepilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tracepilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/tracepilot?schema=public"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "tracepilot_evidence"
      EMBEDDING_PROVIDER: "openrouter"
      OPENROUTER_EMBEDDING_MODEL: "nvidia/nemotron-3.5-embed-8b:free"
      EMBEDDING_DIMENSIONS: 1024
      OPENROUTER_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"
      PAUSE_AUTH: "false"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tracepilot-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  qdrant_data:
